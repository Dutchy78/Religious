# Local development: docker compose up
#   game:   http://localhost:8080        admin: http://localhost:8080/admin
#   e-mail: http://localhost:8025 (Mailpit catches all outgoing mail)
name: religious-game

x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  volumes:
    - ./:/var/www/html
  environment:
    APP_PORT: ${APP_PORT:-8080}
  depends_on:
    db:
      condition: service_healthy

services:
  app:
    <<: *app
    environment:
      ROLE: app
      APP_PORT: ${APP_PORT:-8080}
    healthcheck:
      test: ["CMD", "test", "-f", "/var/www/html/storage/framework/.docker-ready"]
      interval: 5s
      timeout: 3s
      retries: 200
      start_period: 30s

  web:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  # Runs php artisan game:tick every minute (see routes/console.php).
  scheduler:
    <<: *app
    environment:
      ROLE: scheduler
    command: ["php", "artisan", "schedule:work"]

  queue:
    <<: *app
    environment:
      ROLE: queue
    command: ["php", "artisan", "queue:work", "--tries=3"]

  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: religious_game
      MARIADB_USER: religious
      MARIADB_PASSWORD: religious
      MARIADB_ROOT_PASSWORD: root
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "${DB_PORT:-3308}:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

volumes:
  db-data:
